packages:
  - integration-tests
  - mcp-servers/*
  - monitor
  - packages/*
  - tests/*
  - website

# The toolchain (tsc, biome, swc, turbo, vitest, del) reaches this repo as dependencies of
# @kigu/dev, which exposes no bins of its own. Under the isolated linker those bins stay in the
# virtual store and never land on the PATH of a workspace script, so every `tsc`/`biome` call
# fails with "command not found" on a clean install. Public-hoisting them to the root
# node_modules puts them back on the PATH. Mirrors sozai, minus its `@types/*` entry: hoisting
# those makes every ambient type package (react, express, ...) visible to every tsconfig, and
# lets a package compile against an `@types/node` it never declared. Each declares its own.
publicHoistPattern:
  - typescript
  - '@biomejs/*'
  - '@swc/*'
  - vitest
  - '@vitest/*'
  - tsx
  - turbo
  - del-cli

