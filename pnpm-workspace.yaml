minimumReleaseAgeExclude:
  - '@enkaku/*'
  - '@kigu/*'
  - '@kokuin/*'
  - '@sozai/*'
  - '@tejika/*'

# Release management (`pnpm change` to record an intent, `pnpm version -r` to apply them).
# Every published package moves in lockstep, which is what the manual bumps up to 0.10.0 did:
# the packages are one toolkit and are documented against a single version. `mokei-integration-tests`,
# `monitor` and `website` are private and never enter a release plan.
versioning:
  fixed:
    - - '@mokei/anthropic-provider'
      - '@mokei/context-client'
      - '@mokei/context-protocol'
      - '@mokei/context-rpc'
      - '@mokei/context-server'
      - '@mokei/context-server-node'
      - '@mokei/decision-flow'
      - '@mokei/decision-flow-server'
      - '@mokei/flow-client'
      - '@mokei/flow-host'
      - '@mokei/flow-host-node'
      - '@mokei/host'
      - '@mokei/host-desktop'
      - '@mokei/host-node'
      - '@mokei/host-monitor'
      - '@mokei/host-protocol'
      - '@mokei/http-client'
      - '@mokei/http-server'
      - '@mokei/llama-provider'
      - '@mokei/logger'
      - '@mokei/mcp-fetch'
      - '@mokei/mcp-sqlite'
      - '@mokei/mcp-system-one'
      - '@mokei/model-provider'
      - '@mokei/ollama-provider'
      - '@mokei/openai-provider'
      - '@mokei/session'
      - '@mokei/session-node'
      - '@mokei/system-one-client'
      - 'mokei'

